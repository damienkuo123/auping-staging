<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>找不到頁面｜Auping</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f2ea;color:#172b4d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:32px}.card{width:min(720px,100%);background:#fff;padding:clamp(28px,6vw,64px);box-shadow:0 18px 50px rgba(18,36,62,.1)}
    .eyebrow{font-size:14px;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(34px,7vw,68px);line-height:1;margin:.3em 0}p{line-height:1.7;color:#52627a}
    nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}a{color:#172b4d;border:1px solid #172b4d;border-radius:999px;padding:10px 16px;text-decoration:none}a:hover{background:#172b4d;color:#fff}
  </style>
</head>
<body>
  <main><section class="card">
    <div class="eyebrow">404</div>
    <h1>找不到這個頁面</h1>
    <p>這個網址尚未建立本地高擬真頁面，也沒有可安全判定的官方對應頁，因此不會自動送回首頁。請從主要分類繼續瀏覽。</p>
    <nav>
      <a href="/auping-staging/">首頁</a><a href="/auping-staging/box-springs/">Box Springs</a>
      <a href="/auping-staging/beds/">床架</a><a href="/auping-staging/mattresses/">床墊</a>
      <a href="/auping-staging/bed-linen/">寢具</a>
    </nav>
  </section></main>
  <script>
  (async()=>{
    const BASE='/auping-staging';
    const rawPath=decodeURI(location.pathname);
    const canonicalPath=rawPath.replace(/^(?:\/auping-staging)+(?=\/|$)/,'/auping-staging').replace(/\/{2,}/g,'/');
    if(canonicalPath!==rawPath){location.replace(canonicalPath+location.search+location.hash);return}
    const normalize=(value)=>{try{let p=decodeURI(new URL(value,location.href).pathname).replace(/^(?:\/auping-staging)+(?=\/|$)/,'')||'/';if(!p.endsWith('/')&&!/\.[a-z0-9]+$/i.test(p))p+='/';return p}catch{return '/'}};
    try{
      const response=await fetch(`${BASE}/data/rc6-routes.json`,{cache:'no-store'});
      if(!response.ok)return;
      const data=await response.json();
      const current=normalize(location.href).toLowerCase();
      const route=(data.routes||[]).find((item)=>normalize(item.localPath).toLowerCase()===current);
      if(!route)return;
      if(route.mode==='OFFICIAL_REDIRECT'&&route.officialUrl){location.replace(route.officialUrl+location.search+location.hash);return}
      if(route.mode==='DISABLED'&&route.fallbackPath){location.replace(BASE+normalize(route.fallbackPath)+location.search+location.hash)}
    }catch(error){console.warn('[Auping RC6 404]',error)}
  })();
  </script>
</body>
</html>
