<!doctype html><meta charset="utf-8"><title>RC6.1 browser smoke</title>
<pre id="result">RUNNING</pre>
<script>
(async()=>{
  const out=document.querySelector('#result');
  const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
  const wait=async(fn,label,ms=12000)=>{const end=Date.now()+ms;let last;while(Date.now()<end){try{last=fn();if(last)return last}catch{}await sleep(100)}throw new Error('timeout: '+label)};
  const frame=async(src,width=1200)=>{const f=document.createElement('iframe');f.style.cssText=`width:${width}px;height:800px;border:0;position:absolute;left:-100000px;top:0`;document.body.appendChild(f);f.src=src+(src.includes('?')?'&':'?')+'smoke='+Date.now();await new Promise((res,rej)=>{f.onload=res;setTimeout(()=>rej(new Error('frame load timeout '+src)),15000)});const d=f.contentDocument;await wait(()=>d.documentElement.dataset.aupingRc6,'RC6 boot '+src);return {f,d,w:f.contentWindow}};
  const click=(el,w)=>{el.dispatchEvent(new w.MouseEvent('click',{bubbles:true,cancelable:true,view:w}))};
  const change=(el,w)=>{el.checked=true;el.dispatchEvent(new w.Event('change',{bubbles:true}))};
  const visible=(el)=>!el.hidden && getComputedStyle(el).display!=='none' && getComputedStyle(el).visibility!=='hidden';
  const lines=[];
  try{
    // Fresh home: search.
    let x=await frame('/auping-staging/',1200);
    const searchTrigger=await wait(()=>x.d.querySelector('[data-rc6-search-trigger]'),'fresh search trigger');
    click(searchTrigger,x.w);
    const panel=await wait(()=>{const p=x.d.querySelector('.rc6-search');return p&&!p.hidden&&p},'fresh search panel');
    const input=panel.querySelector('input'); input.value='Auronde'; input.dispatchEvent(new x.w.Event('input',{bubbles:true}));
    await wait(()=>panel.querySelectorAll('.rc6-search__result').length>0,'fresh search results');
    lines.push('PASS fresh search'); x.f.remove();

    // Fresh mobile menu.
    x=await frame('/auping-staging/',390);
    const menuTrigger=await wait(()=>x.d.querySelector('[data-rc6-menu-trigger]'),'mobile menu trigger');
    click(menuTrigger,x.w);
    await wait(()=>x.d.querySelector('[data-rc6-menu].rc6-menu-open'),'mobile menu open');
    lines.push('PASS fresh mobile menu'); x.f.remove();

    // Fresh Box Springs exact filter.
    x=await frame('/auping-staging/box-springs/',1200);
    change(await wait(()=>x.d.querySelector('input[data-rc6-filter-key="model"][data-rc6-filter-value="Criade"]'),'Criade input'),x.w);
    change(await wait(()=>x.d.querySelector('input[data-rc6-filter-key="color"][data-rc6-filter-value="黑色"]'),'black input'),x.w);
    await sleep(150);
    let ids=[...x.d.querySelectorAll('[data-rc6-product-card]:not([hidden])')].map(n=>n.dataset.rc6RouteId);
    if(ids.length!==1||ids[0]!=='box-springs--criade-deep-black') throw new Error('fresh box filter got '+JSON.stringify(ids));
    if(!x.d.querySelector('.rc6-filter-chips')) throw new Error('fresh box chips missing');
    lines.push('PASS fresh Box Springs filter'); x.f.remove();

    // Stale RC5 HTML must self-heal through snapshot/rc5 compatibility shims.
    x=await frame('/auping-staging/tests/fixtures/rc5-stale-index.html',1200);
    const staleSearch=await wait(()=>x.d.querySelector('[data-rc6-search-trigger]'),'stale search trigger');
    click(staleSearch,x.w);
    await wait(()=>{const p=x.d.querySelector('.rc6-search');return p&&!p.hidden&&p},'stale search panel');
    lines.push('PASS stale RC5 home self-heal'); x.f.remove();

    x=await frame('/auping-staging/tests/fixtures/rc5-stale-box-springs.html',1200);
    change(await wait(()=>x.d.querySelector('input[data-rc6-filter-key="model"][data-rc6-filter-value="Criade"]'),'stale Criade input'),x.w);
    change(await wait(()=>x.d.querySelector('input[data-rc6-filter-key="color"][data-rc6-filter-value="黑色"]'),'stale black input'),x.w);
    await sleep(150);
    ids=[...x.d.querySelectorAll('[data-rc6-product-card]:not([hidden])')].map(n=>n.dataset.rc6RouteId);
    if(ids.length!==1||ids[0]!=='box-springs--criade-deep-black') throw new Error('stale box filter got '+JSON.stringify(ids));
    lines.push('PASS stale RC5 Box Springs self-heal'); x.f.remove();

    out.textContent='RC6_BROWSER_SMOKE_PASS\n'+lines.join('\n');
    document.title='PASS';
  }catch(e){out.textContent='RC6_BROWSER_SMOKE_FAIL\n'+(e&&e.stack||e);document.title='FAIL';}
})();
</script>
